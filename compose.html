<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 트윗 작성</title>
  <style>
    :root {
      --twitter-blue: #1d9bf0;
      --twitter-blue-hover: #1a8cd8;
      --twitter-blue-disabled: #8ecdf8;
      --bg-color: #000000;
      --border-color: #2f3336;
      --text-color: #e7e9ea;
      --muted-text: #71767b;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .compose-container {
      width: 100%;
      max-width: 600px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      background-color: black;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--twitter-blue);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .compose-area {
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #333;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    textarea {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 20px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 120px;
      margin-top: 12px;
    }

    textarea::placeholder {
      color: var(--muted-text);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .tweet-btn {
      background-color: var(--twitter-blue);
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .tweet-btn:hover {
      background-color: var(--twitter-blue-hover);
    }

    .tweet-btn:disabled {
      background-color: var(--twitter-blue-disabled);
      cursor: default;
    }

    .char-count {
      color: var(--muted-text);
      font-size: 13px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(91, 112, 131, 0.4);
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: black;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      margin: 16px 0;
      background: black;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 4px;
    }

    .modal button {
      width: 100%;
      background: white;
      color: black;
      border: none;
      padding: 12px;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="compose-container">
    <div class="header">
      <h2>트윗하기</h2>
      <button class="settings-btn" onclick="openTokenModal()">🔑 깃허브 토큰 설정</button>
    </div>

    <div class="compose-area">
      <div class="avatar">
        <img src="https://github.com/Nekonic.png" alt="Avatar">
      </div>
      <div class="input-area">
        <textarea id="tweetInput" placeholder="무슨 일이 일어나고 있나요?"></textarea>
      </div>
    </div>

    <div class="footer">
      <span class="char-count" id="charCount">0 / 280</span>
      <button class="tweet-btn" id="tweetBtn" onclick="postTweet()" disabled>게시하기</button>
    </div>
  </div>

  <div class="modal-overlay" id="tokenModal">
    <div class="modal">
      <h3 style="margin-bottom: 8px;">깃허브 토큰 입력</h3>
      <p style="font-size: 14px; color: var(--muted-text);">발급받으신 클래식 토큰(ghp_...)을 입력해주세요. (브라우저에만 안전하게 저장됩니다)</p>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
      <button onclick="saveToken()">저장하기</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('tweetInput');
    const btn = document.getElementById('tweetBtn');
    const count = document.getElementById('charCount');
    const modal = document.getElementById('tokenModal');
    const tokenInput = document.getElementById('tokenInput');

    // 텍스트 감지하여 버튼 활성화
    input.addEventListener('input', () => {
      const len = input.value.trim().length;
      count.textContent = `${len} / 280`;
      
      if (len > 0 && len <= 280) {
        btn.disabled = false;
        count.style.color = 'var(--muted-text)';
      } else {
        btn.disabled = true;
        if (len > 280) count.style.color = '#f4212e';
      }
    });

    // 토큰 관리
    function openTokenModal() {
      tokenInput.value = localStorage.getItem('github_pat') || '';
      modal.style.display = 'flex';
    }

    function saveToken() {
      localStorage.setItem('github_pat', tokenInput.value.trim());
      modal.style.display = 'none';
      alert('토큰이 저장되었습니다!');
    }

    // 트윗 게시 (깃허브 API 호출)
    async function postTweet() {
      const token = localStorage.getItem('github_pat');
      if (!token) {
        openTokenModal();
        return;
      }

      const content = input.value.trim();
      const date = new Date();
      
      // 파일명: YYYY-MM-DD-HHMMSS.md
      const pad = (n) => n.toString().padStart(2, '0');
      const dateString = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
      const timeString = `${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
      const filename = `${dateString}-${timeString}.md`;

      // YAML Frontmatter 포맷팅
      const fileContent = `---
layout: tweet
title: "${dateString} 트윗"
date: ${date.toISOString()}
---
${content}`;

      // Base64 인코딩 (UTF-8 지원)
      const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

      btn.disabled = true;
      btn.textContent = '전송 중...';

      try {
        const response = await fetch(`https://api.github.com/repos/Nekonic/Nekonic.github.io.data/contents/_tweets/${filename}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: `tweet: ${content.substring(0, 20)}...`,
            content: encodedContent
          })
        });

        if (response.ok) {
          input.value = '';
          input.dispatchEvent(new Event('input'));
          alert('성공적으로 트윗되었습니다! 곧 블로그에 반영됩니다.');
        } else {
          const error = await response.json();
          if (error.message.includes('Bad credentials')) {
            alert('토큰이 올바르지 않습니다. 다시 입력해주세요.');
            openTokenModal();
          } else {
            alert('업로드 실패: ' + error.message);
          }
        }
      } catch (err) {
        alert('네트워크 오류가 발생했습니다.');
      } finally {
        btn.textContent = '게시하기';
      }
    }

    // 초기 토큰 확인
    if (!localStorage.getItem('github_pat')) {
      setTimeout(openTokenModal, 500);
    }
  </script>
</body>
</html>
