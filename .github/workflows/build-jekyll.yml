name: Github Pages

on:
  push:
    branches:
      - main
      - master
  repository_dispatch:
    types: [data_updated]

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync posts and tweets from data repo
        uses: actions/checkout@v4
        with:
          repository: Nekonic/Nekonic.github.io.data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data_repo
          fetch-depth: 1
          persist-credentials: false

      - name: Copy posts and tweets
        run: |
          set -euo pipefail

          mkdir -p _posts _tweets
          cp -r _data_repo/_posts/. _posts/ 2>/dev/null || true
          cp -r _data_repo/_tweets/. _tweets/ 2>/dev/null || true
          rm -rf _data_repo

      # Use GitHub Actions' cache to cache dependencies on servers
      - uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # Use GitHub Deploy Action to build and deploy to Github
      - uses: jeffreytse/jekyll-deploy-action@master
        with:
          provider: 'github'
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ''
          branch: 'gh-pages'
          jekyll_src: './'
          jekyll_cfg: '_config.yml'
          jekyll_baseurl: ''
          cname: ''
          actor: ''
